<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botanita Bonita — Panel de administración</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e5e5e5;--card:#fff;--ink:#12382b;--mut:#5b6b63;--green:#6dbb2f;--dark:#0f3d2e;--orange:#ff8a1f;--pink:#ff7eb6;--line:#e7e5dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line);background:#ffffffcc;backdrop-filter:blur(10px);position:sticky;top:0;z-index:1}
main{max-width:1100px;margin:16px auto;padding:0 16px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--card);border:2px solid var(--line);padding:8px 14px;border-radius:99px;font-weight:600}
.tab.active{background:var(--green);border-color:var(--green);color:#fff}
.hidden{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px #0000000d}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--dark);color:#fff;border:0;padding:8px 12px;border-radius:10px;font-weight:700}
.btn.mini{padding:4px 8px;font-weight:600}
.btn.logout{background:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
</style>
</head>
<body>
<header><b>Panel de administración</b><div><span id="who"></span> <button id="logout" class="btn logout hidden">Cerrar sesión</button> <a href="index.html">Volver a la tienda</a></div></header>
<main>
  <div id="login" class="card" style="max-width:420px;margin:40px auto">
    <h2>Acceso admin</h2>
    <p style="color:var(--mut);margin-top:0">Contraseña definida en Netlify</p>
    <input id="pwd" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn" class="btn" style="margin-top:8px">Entrar</button>
    <p id="loginErr" style="color:var(--orange);font-size:14px"></p>
  </div>

  <div id="dash" class="hidden">
    <div class="tabs">
      <button class="tab active" data-t="prod">Productos</button>
      <button class="tab" data-t="orders">Pedidos</button>
      <button class="tab" data-t="coupons">Cupones</button>
    </div>

    <section id="s-prod">
      <div class="card">
        <h3 style="margin:0 0 8px">Agregar/editar producto</h3>
        <div class="grid">
          <div><label>Nombre</label><input id="pName"></div>
          <div><label>Categoría</label><input id="pCat"></div>
          <div><label>Precio</label><input id="pPrice" type="number"></div>
          <div><label>Stock</label><input id="pStock" type="number"></div>
          <div><label>Emoji</label><input id="pE"></div>
          <div><label>Etiqueta</label><input id="pTag"></div>
          <div><label>Color (bg)</label><input id="pBg" placeholder="#ffe3c7"></div>
          <div><label>Imagen URL o subir archivo</label><input id="pImg" placeholder="https://..."><input id="pFile" type="file" accept="image/*" style="margin-top:4px"></div>
          <div style="grid-column:1/-1"><label>Descripción</label><textarea id="pDesc" rows="2"></textarea></div>
        </div>
        <div style="margin-top:8px">
          <button id="saveP" class="btn">Guardar producto</button>
          <button id="newP" class="btn" style="background:var(--mut);margin-left:6px">Nuevo</button>
        </div>
        <input type="hidden" id="pId">
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Foto</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
          <tbody id="prodBody"></tbody>
        </table>
      </div>
    </section>

    <section id="s-orders" class="hidden">
      <div class="card">
        <table>
          <thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Productos</th><th>Método</th><th>Total</th><th>Estado</th><th></th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
    </section>

    <section id="s-coupons" class="hidden">
      <div class="card">
        <h3 style="margin:0 0 8px">Nuevo cupón</h3>
        <div class="grid">
          <div><label>Código</label><input id="cCode"></div>
          <div><label>Tipo</label><select id="cType"><option value="percent">Porcentaje</option><option value="fixed">Monto fijo</option></select></div>
          <div><label>Valor</label><input id="cVal" type="number"></div>
          <div><label>Mínimo subtotal</label><input id="cMin" type="number"></div>
          <div><label>Activo</label><select id="cActive"><option value="true">Sí</option><option value="false">No</option></select></div>
        </div>
        <button id="saveC" class="btn" style="margin-top:8px">Guardar cupón</button>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Mín. subtotal</th><th>Activo</th><th>Acciones</th></tr></thead>
          <tbody id="coupsBody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script src="assets/admin.js"></script>
</body>
</html>
